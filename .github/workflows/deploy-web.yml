name: Deploy web app

# Optional: builds in GitHub Actions and deploys a prebuilt app to Vercel.
# The Vercel project is also linked to this repo and builds by itself on every push
# (app/vercel.json + app/scripts/vercel-install.sh), so this is only needed if you
# prefer GitHub to do the build. Needs secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --wasm
          cp vercel.json build/web/vercel.json
      - name: Deploy
        working-directory: app/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
